[pytest]
# jingni-trader 测试套件配置
# 按子 Skill 边界组织测试，支持通过标记选择性运行

markers =
    # 按子 Skill 划分
    skill_master: 主调度器（engine.py + scripts/）测试
    skill_data_engine: data-engine 测试
    skill_factor_engine: factor-engine 测试
    skill_strategy_model_engine: strategy-model-engine 测试
    skill_backtest_engine: backtest-engine 测试
    skill_portfolio_risk_engine: portfolio-risk-engine 测试
    skill_execution_monitor_engine: execution-monitor-engine 测试
    skill_reports_engine: reports-engine 测试

    # 按测试层级划分
    contract: L1 契约测试（验证 run(ctx) 接口契约）
    unit: L2 单元测试（skill 内部模块）
    integration: L3 集成测试（跨 skill 真实对接）

    # 按运行特性划分
    slow: 慢测试（>5s）
    requires_network: 需要网络访问
    requires_sklearn: 需要 sklearn 真实安装
    requires_tushare_token: 需要 TUSHARE_TOKEN
    requires_gm_token: 需要 GM_TOKEN
    requires_wind_terminal: 需要 Wind 金融终端
    requires_ifind_credentials: 需要 iFinD 账号密码
    requires_xtquant: 需要 xtquant/QMT 客户端
    requires_alphalens: 需要 alphalens-reloaded 真实安装
    requires_polars: 需要 polars 真实安装

# 默认测试路径
testpaths = tests

# 输出格式
addopts = -ra
