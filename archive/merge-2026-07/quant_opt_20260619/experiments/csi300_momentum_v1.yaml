# jingni-trader 实验定义示例 (借鉴自 Microsoft Qlib qrun)
#
# 使用方法（未来 PR 合入后）：
#   python engine.py --yaml experiments/csi300_momentum_v1.yaml
#
# 关键设计：
#   - stages 列表定义执行顺序
#   - 每个 stage 内部用 &anchor 复用公共配置（Qlib 范式）
#   - market / benchmark 通过 &ref 引用市场段配置

experiment_name: csi300_momentum_v1
market: &market csi300
benchmark: &benchmark SH000300
start_date: &start 2021-01-01
end_date: &end 2024-12-31
init_capital: 1000000

stages:
  - data:
      provider: tushare
      adjust: hfqs
      include_financial: true
      pit_required: true            # 开启 PIT 校验

  - factor:
      neutralize: industry          # 行业中性化
      neutralize_mcap: true
      fusion_method: ic_weighted
      alpha158: true                # 启用 Qlib Alpha158 因子集

  - model:
      type: lightgbm
      optuna_trials: 30
      cpcv:                         # 启用 Combinatorial Purged CV
        n_splits: 5
        n_test_splits: 2
        embargo_pct: 0.01
        purge_pct: 0.01

  - backtest:
      backend: native
      commission_rate: 0.0003
      stamp_tax: 0.001
      slippage: 0.001
      t_plus_1: true

  - portfolio:
      method: max_sharpe
      max_weight: 0.10
      min_weight: 0.001
      max_turnover: 0.30
      max_industry_deviation: 0.05

  - recorders:                     # 可插拔分析记录器
      - SignalRecorder
      - SigAnaRecorder
      - PortAnaRecorder
      - FactorICRecorder           # 自定义 recorder（未来扩展）

  - report:
      format: html
      include: [equity_curve, drawdown, factor_ic, attribution]
